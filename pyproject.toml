[project]
name = "huur"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4.26.0",
    "markitdown[pdf]>=0.1.8",
    "openai>=3.16.2",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
huur = "huur:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
